# The design-configurator pack's own settings.  Edited by the Studio; the
# engine reads this file and never writes it.

# The setup's format (engine/pack.py, PACK_FORMAT): an engine reads setups
# up to its own format and refuses a newer one.
pack_format: 1

# Who sees the parameter list, per agent and per topology (the 7-, 5- and
# 3-agent systems; a cell exists only where the agent does):
#
#   full   the list in the agent's system prompt, ranges included
#   names  the list in the prompt with every [min; max] range removed
#   tool   not in the prompt; the agent can call dc_params_list
#   none   neither
#
# This is the setup's DEFAULT.  Workflow Settings > "Parameter list access"
# changes cells for the next session (workflow_settings/parameter_access.json).
# The Database Handler cannot take "tool".  See engine/parameter_access.py.
parameter_access:
  receptionist:         {7: tool,  5: tool,  3: tool}
  orchestrator:         {7: tool}
  planner:              {7: tool,  5: tool,  3: tool}
  user_input_inspector: {7: none,  5: none}
  dc_input_creator:     {7: full,  5: full}
  dc_input_inspector:   {7: full}
  tool_caller:          {7: full,  5: full}
  dc_output_inspector:  {7: names, 5: names}
  design_engineer:      {3: full}
  requirements_analyst: {3: names}
  database_handler:     {7: none,  5: none,  3: none}

# The primer: one picture and its text ($dc_params_primer_text -- an agent
# may have its own copy), sent to the agents below with every call, between
# their system prompt and the conversation (agents/shared/dc_primer.py).
#
#   image   a PNG in assets/; empty: the text alone
#   agents  per topology, the agents that get it (any but the Database
#           Handler); an empty list: none
#
# Workflow Settings > DC_PARAMS_PRIMER_ENABLED switches it off for every
# agent (a text-only model cannot take the picture).  See engine/primer.py.
primer:
  image: dc_params_primer.png
  agents:
    7: [user_input_inspector, dc_input_creator, dc_input_inspector, dc_output_inspector]
    5: [user_input_inspector, dc_input_creator, dc_output_inspector]
    3: [design_engineer, requirements_analyst]

# The web app's Download buttons: which geometry tool (setups/propeller/tools/, kind:
# geometry) rebuilds the model a user downloads -- from the attempt's
# parameters.json, or from the Parameters page's sliders -- or "saved", the
# model file the run built.  If the tool fails, the saved file is downloaded.
# This is the DEFAULT; Workflow Settings > Tools > Downloads changes it for
# the next session (workflow_settings/tool_settings.json, under "downloads").
downloads:
  geometry_tool: rhino_geometry

# The render-compression panel's sample pictures (Workflow Settings > Render
# compression): the image tools are run on these parameter sets -- small,
# medium and large propellers spanning the render sizes the slider is tuned
# against -- and one picture per compression kind is kept per set
# (engine/image_run.py).  They are pictures, not designs: a value may lie
# outside its parameter's range.
render_samples:
  small: {bladeCount: 3, impellerRadius: 60, impellerThickness: 2, innerThickness: 8, innerMaxPos: 4, innerCamber: 1, innerChord: 4, innerAngle: 8, middlePos: 0.6, middleChord: 12, middleAngle: 12, outerThickness: 8, outerMaxPos: 4, outerCamber: 2, outerChord: 8, outerAngle: 16}
  medium: {bladeCount: 5, impellerRadius: 70, impellerThickness: 2, innerThickness: 5, innerMaxPos: 4, innerCamber: 1, innerChord: 7, innerAngle: 10, middlePos: 0.6, middleChord: 22, middleAngle: 15, outerThickness: 6, outerMaxPos: 4, outerCamber: 2, outerChord: 16, outerAngle: 20}
  large: {bladeCount: 6, impellerRadius: 80, impellerThickness: 2, innerThickness: 6, innerMaxPos: 4, innerCamber: 2, innerChord: 12, innerAngle: 12, middlePos: 0.6, middleChord: 30, middleAngle: 18, outerThickness: 7, outerMaxPos: 4, outerCamber: 3, outerChord: 30, outerAngle: 24}
