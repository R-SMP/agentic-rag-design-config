# The blade-sections tool: renders the three blade cross-sections (Inner /
# Middle / Outer) of an attempt as one PNG.  A plain function
# (render_blade_sections.py); the engine builds the LLM tool from it and
# from this file (engine/pack_tools.py).
name: render_blade_sections
display_name: Blade Sections
kind: helper
roles: [tool_runner]
entrypoint: render_blade_sections.py:render_blade_sections

description: |-
  Render the three blade cross-sections (Inner / Middle / Outer) stacked
  vertically into a PNG image.

  Pass the absolute path to a parameters JSON file (an attempt's
  ``parameters.json``).  The image shows each section's airfoil rotated by
  its angle of attack, colour-coded with a name label, plus a small angle
  protractor.  The PNG is written into that attempt's folder and will be
  shown to the user in the chat; any agent with an image-reading tool
  (``view_images``) can view it by passing the returned path.

  Args:
      parameters_path: Absolute path to the parameters ``.json`` file
          (must sit inside the attempts directory).
      grid: When True, draw a light 1 mm x 1 mm reference grid behind the
          sections.  Default False.  Only enable it when a true-millimetre
          grid genuinely helps and will not mislead — e.g. do NOT enable it
          when matching a user's drawing whose own grid squares are not
          1 mm, because the scales would not correspond.  When in doubt,
          leave it off.

  Returns:
      A short message stating the written PNG path (and its size), or
      precisely why the render could not be produced.

# On / off for the whole tool: OFF = not bound to any agent, and the
# <<IF:tool:render_blade_sections>> regions leave the prompts (the
# <<IFNOT:...>> "exists but currently OFF" note stays).
switch:
  default: true
  label: Blade sections tool
  description: >-
    ON = the tool runner can render the blade cross-sections and every agent
    is told the capability exists; OFF = the system works without it.

outputs:
  # grid=True writes the variant render_blade_sections_grid.png.
  images:
    - {view: blade_sections, file: render_blade_sections.png, order: 30, default_enabled: true, compression: cross_sections, variants: [grid], label: "Render view: blade sections"}

# May the save step use this tool to add a missing picture to an attempt it
# archives (agents/shared/attempt_renders.py)?
fill_on_save: true

# The note added under an attempt's opened picture: the values it was drawn
# from, per section (view_images).
image_note: sections_geom.py:rendered_params_block

# Its place in the tool runner's numbered tool list (its entry is
# prompts/tool_list_entry.md), and the prompt text it owns: the files of
# these slots live in prompts/ (engine/pack.py).
list_order: 10
prompt_slots:
  - precision_multi_phase_rule
  - render_type_choice
  - roster_sections_tool_sentence
  - routing_sections_alternative
  - sections_rerun_case
  - blade_sections_visualizer
  - blade_sections_visualizer_off
  - blade_sections_visualizer_per_agent
  - sections_tool_block_full
  - sections_tool_block_overlay
