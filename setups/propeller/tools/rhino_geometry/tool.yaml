# The RhinoCompute geometry tool: builds the propeller's model from its
# parameters with RhinoCompute and the Grasshopper definition beside this
# file.  The engine calls it -- the generator's geometry_tool /
# fallback_geometry_tool settings, the web app's Download buttons -- never an
# agent (engine/tooling.py, kind: geometry).
name: rhino_geometry
display_name: RhinoCompute
kind: geometry
entrypoint: rhino_geometry.py:make_model

description: >-
  Builds the propeller with RhinoCompute and the Grasshopper definition
  Propeller_Raul_V1.2.gh: the exact geometry; needs the RhinoCompute server
  (RHINO_COMPUTE_URL).

outputs:
  model_format: obj

# The environment variables it reads (names only: the values live in .env
# or the hosting provider, never in the setup).
secrets:
  - {env: RHINO_COMPUTE_URL, required: false, description: "The RhinoCompute server's address (default http://localhost:6500/)."}
  - {env: RHINO_COMPUTE_API_KEY, required: false, description: "Its API key, when the server asks for one."}
