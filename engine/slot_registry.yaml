# The slot registry: every $slot the engine offers, in one place.
#
# Read by agents/shared/prompts.py (which file fills each slot, and how) and
# by the Studio (which form field shows it).  Owned by the engine: a pack
# never edits it.  The TEXT of a pack slot lives in setups/<setup>/fragments/<folder>/;
# whether a field is linked across topologies or has per-agent copies is read
# from which files exist there (engine/pack.py), never stored here.
#
#   source  pack | engine | setting | generated
#   folder  dc | tools                 (pack)  setups/<setup>/fragments/<folder>/
#   filled_by tool                     (pack)  text about one of the pack's
#                                      tools: it lives in the prompts/ folder
#                                      of the tool that lists it in its
#                                      tool.yaml (prompt_slots), and reads as
#                                      empty when no tool does
#   from    (generated) what computes it -- prompts._GENERATED_SLOTS, or
#                                      _GENERATED_PER_AGENT for text that
#                                      differs per agent
#   kind    phrase | block | word      phrase = one line spliced into a
#                                      sentence, re-wrapped at 80 columns
#   use     prompt (default) | runtime runtime = read by Python, not a $slot
#   missing crash (default) | empty    empty = no shared text, per-agent only
#   strip   right (default) | both
#   section the Studio section that shows the field
#   title   the Studio's plain title for the field (its name shows beside it)

format: 1
