# =============================================================================
# Engine slots: text owned by the blueprint itself, never by a pack.  The
# Studio shows them read-only.  `file` is under agents/shared/prompt_fragments/
# (a topology's agents/<N>agent/prompt_fragments/<name>_<N>agents.md wins);
# `scoped: true` lets an agent own a copy (<name>_<agent>.md).
# =============================================================================
  hard_constraints_generic:
    source: engine
    kind: block
    file: generic_constraints.md
    scoped: true
  value_states:
    source: engine
    kind: block
    file: value_states.md
    scoped: true
  available_agents:
    source: engine
    kind: block
    file: available_agents.md
    scoped: true
  routing_receptionist:
    source: engine
    kind: block
    file: routing_receptionist.md
  routing_hub:
    source: engine
    kind: block
    file_from: hub            # routing_<hub agent>.md of the running topology
    files: [routing_orchestrator.md]
  pipeline_flow:
    source: engine
    kind: block
    file: pipeline_flow.md
    scoped: true

# Values read from workflow_settings/settings.py when prompts.py is imported.
  embedding_provider:
    source: setting
    kind: word
    setting: EMBEDDING_PROVIDER
  embedding_model:
    source: setting
    kind: word
    setting: EMBEDDING_MODEL
  embedding_vector_dims:
    source: setting
    kind: word
    setting: EMBEDDING_VECTOR_DIMS
  embedding_max_response_tokens:
    source: setting
    kind: word
    setting: EMBEDDING_MAX_RESPONSE_TOKENS
