<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design configurators</title>
  <!-- The main menu (MAS-blueprint, one deploy): the configurators of
       setups/, one loaded at a time, and the MAS Studio at /studio/
       (studio/embedded.py).  web_app.py writes a card per configurator in
       place of SETUP CARDS, and why another cannot be loaded now in place
       of REFUSAL.  Clicking a configurator that is not loaded loads it
       (POST /api/setups/load), then opens it at /configurator. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 32px 16px; background: #0f1116; color: #e4e6eb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 760px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    h3 { margin: 28px 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
         text-transform: uppercase; color: #9aa0aa; }
    .sub { margin: 0; color: #9aa0aa; }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    a.choice {
      display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 10px;
      border: 1px solid #2a2f3a; background: #161a22; color: inherit; text-decoration: none;
      transition: border-color 120ms, background 120ms;
    }
    a.choice:hover, a.choice:focus-visible { border-color: #5b8def; background: #1a2030; outline: none; }
    a.choice h2 { margin: 0; font-size: 18px; }
    a.choice p { margin: 0; color: #b4b9c3; line-height: 1.45; flex: 1; }
    a.choice code { color: #b4b9c3; font-size: 13px; }
    a.choice span { color: #7aa7ff; font-weight: 600; }
    .badge {
      margin-left: 6px; padding: 2px 8px; border-radius: 999px; vertical-align: 2px;
      font-size: 12px; font-style: normal; font-weight: 600; background: #1f3b2a; color: #7ee2a1;
    }
    .busy a.choice { pointer-events: none; opacity: 0.6; }
    .note { margin: 20px 0 0; padding: 12px 14px; border-radius: 8px; line-height: 1.45;
            border: 1px solid #2a2f3a; background: #161a22; }
    .note.error { border-color: #7a3a3a; background: #2a1618; color: #f2b8b8; }
    .note ul { margin: 8px 0 0; padding-left: 20px; }
    [hidden] { display: none !important; }
    form.code { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0 0; }
    form.code label { flex-basis: 100%; color: #b4b9c3; }
    form.code input, form.code button {
      font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid #2a2f3a;
      background: #161a22; color: inherit;
    }
    form.code input { flex: 1; min-width: 0; }
    form.code button { background: #5b8def; border-color: #5b8def; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Design configurators</h1>
    <p class="sub">Choose a configurator to open, or the MAS Studio. Loading another configurator takes a moment.</p>
    <p id="refusal" class="note"><!-- REFUSAL --></p>
    <form id="code-form" class="code" hidden>
      <label for="code-input">Enter the invite code to load another configurator.</label>
      <input id="code-input" type="password" placeholder="Invite code" autocomplete="off" />
      <button type="submit">Enter</button>
    </form>
    <p id="status" class="note" role="status" hidden></p>
    <h3>Configurators</h3>
    <div id="setups" class="choices">
<!-- SETUP CARDS -->
    </div>
    <h3>Build your own</h3>
    <div class="choices">
      <a class="choice" href="/studio/">
        <h2>MAS Studio</h2>
        <p>Build the multi-agent system of your own design configurator, starting from an example: its parameters, texts and tools.</p>
        <span>Open →</span>
      </a>
    </div>
  </main>
  <script>
    "use strict";
    const setupsBox = document.getElementById("setups");
    const refusal = document.getElementById("refusal");
    const status = document.getElementById("status");
    const codeForm = document.getElementById("code-form");
    const codeInput = document.getElementById("code-input");
    let pending = null;   // the card waiting for the invite code

    refusal.hidden = !refusal.textContent.trim();

    function say(text, error, problems) {
      status.textContent = text;
      status.classList.toggle("error", !!error);
      if (problems && problems.length) {
        const list = document.createElement("ul");
        problems.forEach(function (p) {
          const item = document.createElement("li");
          item.textContent = p;
          list.appendChild(item);
        });
        status.appendChild(list);
      }
      status.hidden = !text;
    }

    async function load(card) {
      refusal.hidden = true;
      say("Loading the " + card.dataset.title + "…", false);
      document.body.classList.add("busy");
      let r = null;
      try {
        r = await fetch("/api/setups/load", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ setup: card.dataset.setup }),
        });
      } catch (e) {
        document.body.classList.remove("busy");
        say("The server could not be reached: " + e, true);
        return;
      }
      if (r.ok) {
        window.location.href = card.getAttribute("href");
        return;
      }
      document.body.classList.remove("busy");
      let detail = null;
      try { detail = (await r.json()).detail; } catch (_) { /* no body */ }
      if (r.status === 401) {
        pending = card;
        say("", false);
        codeForm.hidden = false;
        codeInput.value = "";
        codeInput.focus();
      } else if (detail && typeof detail === "object") {
        say(detail.message, true, detail.problems);
      } else {
        say(detail || ("Loading failed (HTTP " + r.status + ")."), true);
      }
    }

    setupsBox.addEventListener("click", function (e) {
      const card = e.target.closest("a.choice");
      if (!card || card.dataset.loaded === "1") return;   // the loaded one just opens
      e.preventDefault();
      load(card);
    });

    codeForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const r = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: codeInput.value }),
      }).catch(function () { return null; });
      if (!r || !r.ok) {
        say("The invite code did not match.", true);
        return;
      }
      codeForm.hidden = true;
      if (pending) load(pending);
    });
  </script>
</body>
</html>
